name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Unit tests (no ROS needed)
        working-directory: ros2_ws/src/roomba_bringup
        run: python -m pytest -q test
      - name: Shell syntax
        run: bash -n scripts/setup_pi.sh
