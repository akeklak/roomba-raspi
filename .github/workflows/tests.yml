name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Unit tests (no ROS needed)
        working-directory: ros2_ws/src/roomba_bringup
        run: python -m pytest -q test
      - name: Sim world parser tests (no ROS needed)
        working-directory: ros2_ws/src/roomba_sim
        run: python -m pytest -q test
      - name: Shell syntax
        run: bash -n scripts/setup_pi.sh

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Type check and build
        run: npm run build
