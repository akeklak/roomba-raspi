server {
  listen 80;
  root /usr/share/nginx/html;

  # The robot meshes (.dae, served as octet-stream) are large XML files and shrink a lot.
  gzip on;
  gzip_types application/octet-stream application/javascript text/css;

  location / {
    try_files $uri /index.html;
  }

  # File names under /assets change with every build, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
