# slam_toolbox settings for building a map with the LD19 lidar (launch/mapping.launch.py).
# Based on slam_toolbox's config/mapper_params_online_async.yaml; the lines marked "ours" differ.
slam_toolbox:
  ros__parameters:
    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames and topics (same on the robot and in the sim)
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: false                # ours: map_manager saves maps itself
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05      # ours: map -> odom at 20 Hz
    map_update_interval: 3.0            # ours: redraw the map every 3 s, so the web UI shows it growing
    resolution: 0.05                    # 5 cm cells
    min_laser_range: 0.2                # ours: hits closer than this are the robot itself (mast, Pi)
    max_laser_range: 8.0                # ours: the LD19 reaches 12 m, but long grazing hits are noisy
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000         # needed to save large maps
    enable_interactive_mode: false      # ours: only useful with RViz, and costs CPU on the Pi

    # When to add a scan to the map
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3        # ours: every 30 cm (default 0.5 m), for small rooms
    minimum_travel_heading: 0.3         # ours: or every 17 degrees of turning (default 0.5 rad)
    # ours: also count turning on the spot. Without this slam_toolbox only checks the distance
    # moved, so while the robot spins in place nothing corrects the wheels' idea of its heading.
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # Loop closure: recognizing a place it has already mapped, which removes accumulated drift
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Scan matcher search window
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
