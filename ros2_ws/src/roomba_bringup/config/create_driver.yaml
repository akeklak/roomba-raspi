# Parameters for create_driver (AutonomyLab/create_robot).
# The Roomba 600 series speaks the same Open Interface as the Create 2, so robot_model is CREATE_2
# (set in robot.launch.py). Baud defaults to 115200 for that model.
create_driver:
  ros__parameters:
    # Serial device. /dev/roomba is a stable name made by scripts/99-roomba-raspi.rules.
    dev: "/dev/roomba"
    robot_model: "CREATE_2"
    base_frame: "base_footprint"
    odom_frame: "odom"
    # Stop the wheels if no /cmd_vel arrives for this long (seconds).
    latch_cmd_duration: 0.5
    loop_hz: 10.0
    publish_tf: true
    # Some 600-series firmware reports the OI mode wrongly; flip this to true if
    # the driver keeps logging mode errors on day one.
    oi_mode_workaround: false
